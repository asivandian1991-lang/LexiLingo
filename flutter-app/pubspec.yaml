name: lexilingo_app
description: "Your Journey to Fluency Starts with a Conversation"
publish_to: 'none'
version: 1.7.0+17

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^19.5.0
  google_generative_ai: ^0.4.7
  intl: ^0.20.2
  timezone: ^0.10.1
  http: ^1.6.0
  get_it: ^8.0.3
  dartz: ^0.10.1
  equatable: ^2.0.5
  uuid: ^4.5.1
  flutter_markdown: ^0.7.4+1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  dio: ^5.8.0+1
  go_router: ^14.8.1
  fl_chart: ^0.71.0
  pinput: ^6.0.2
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.3
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.3.0
  cloud_firestore: ^5.5.2
  firedart: ^0.9.8
  flutter_dotenv: ^6.0.0
  confetti: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  record: ^5.2.1
  web_socket_channel: ^3.0.3
  flutter_soloud: ^5.1.5
  just_audio: ^0.9.46
  audio_service: ^0.18.16
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  web: ^1.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  youtube_player_iframe: ^6.0.2
  share_plus: ^10.1.4
  in_app_review: ^2.0.9
  app_links: ^6.3.3
  purchases_flutter: ^8.10.0
  easy_localization: ^3.0.7
  flutter_facebook_auth: ^7.1.5
  flutter_facebook_auth_web: ^6.1.2
  encrypt: ^5.0.3

dependency_overrides:
  record_linux: 1.3.0
  record_web: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  firebase_auth_platform_interface: any
  firebase_messaging_platform_interface: any
  cloud_firestore_platform_interface: any

flutter:
  uses-material-design: true
  assets:
    - assets/env/dev_config
    - assets/env/prod_config
    - animation/
    - assets/background-roadmap/
    - assets/badges/
    - assets/course/
    - assets/ranking/
    - assets/i18n/
    - assets/sounds/
    - assets/logo/
    - assets/out-app/
    - assets/flags/
    - assets/tutors/
  fonts:
    - family: NotoSansCJK
      fonts:
        - asset: assets/fonts/NotoSansKR-VariableFont_wght.ttf
